apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-users-api-deployment
  labels:
    app: fcg-users-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fcg-users-api
  template:
    metadata:
      labels: 
        app: fcg-users-api
      annotations:
        autor: Alex O Ferreira
        description: "Deployment do microsservico de Usuarios API do Fiap Cloud Games"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - fcg-users-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: c-fcg-users-api
        image: acrfiapcloudgames.azurecr.io/fcg-user-api:1.4
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        env:
          - name: AzureServiceBus__ConnectionString
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: ServiceBus_Connection
          - name: DatabaseSettings__Host
            valueFrom:
              configMapKeyRef:
                name: user-config
                key: DB_SERVER
          - name: DatabaseSettings__DatabaseName
            valueFrom:
              configMapKeyRef:
                name: user-config
                key: DB_NAME
          - name: DatabaseSettings__Port
            valueFrom:
              configMapKeyRef:
                name: user-config
                key: DB_PORT         
          - name: ASPNETCORE_ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: user-config
                key: ENVIRONMENT
          - name: DatabaseSettings__Username
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_USER
          - name: DatabaseSettings__Password
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: DB_PASS
          - name: JwtSettings__Issuer
            valueFrom:
              configMapKeyRef:
                name: user-config
                key: JWT_ISSUER
          - name: JwtSettings__Audience
            valueFrom:
              configMapKeyRef:
                name: user-config
                key: JWT_AUDIENCE              
          - name: JwtSettings__Secret
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: JWT_SECRET   
        volumeMounts:
          - name: secrets-store
            mountPath: /mnt/secrets
            readOnly: true
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fcg-kv      
        
---
apiVersion: v1
kind: Service
metadata:
  name: svc-fcg-users-api
spec:
  type: ClusterIP
  selector:
    app: fcg-users-api
  ports:
    - port: 8081
      targetPort: 8080          